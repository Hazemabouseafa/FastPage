# Example only: requires Cloudflare Origin CA certificate and key installed on your VPS.
# Replace certificate paths with your actual server paths.
server {
    listen 80;
    server_name fastpage.my *.fastpage.my;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name fastpage.my *.fastpage.my;

    ssl_certificate /etc/ssl/cloudflare/fastpage-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/fastpage-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
